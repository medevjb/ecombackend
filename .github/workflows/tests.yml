name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ecommerce_ci
      DB_USERNAME: ecommerce_ci
      DB_PASSWORD: ci-only-password

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ecommerce_ci
          MYSQL_USER: ecommerce_ci
          MYSQL_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Set up the application and verify migration rollback
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan migrate --no-interaction
          php artisan migrate:rollback --no-interaction
          php artisan migrate --no-interaction
          php artisan db:seed --no-interaction

      - name: Check PHP style and types
        run: |
          composer lint:check
          vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Run backend tests
        run: vendor/bin/pest

      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.16.0 lint --extends=spec docs/api/openapi.yaml

      - name: Check frontend tooling
        run: |
          npm run build
          npm run check -- resources/js resources/css vite.config.ts
          npm run types:check
