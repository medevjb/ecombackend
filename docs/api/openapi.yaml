                    examples:
                        validation:
                            value:
                                success: false
                                message: The supplied data is invalid.
                                data: null
                                meta: null
                                errors:
                                    code: VALIDATION_FAILED
                                    fields:
                                        email: [The email field is required.]
                                request_id: req_01KB8AK2AP4NH2PWRHDCJ9S2NX
    schemas:
        Success:
            type: object
            required: [success, message, data, meta, errors, request_id]
            properties:
                success:
                    const: true
                message:
                    type: string
                data: {}
                meta:
                    type: [object, 'null']
                errors:
                    type: 'null'
                request_id:
                    type: string
        Error:
            type: object
            required: [success, message, data, meta, errors, request_id]
            properties:
                success:
                    const: false
                message:
                    type: string
                data:
                    type: 'null'
                meta:
                    type: 'null'
                errors:
                    type: object
                    required: [code]
