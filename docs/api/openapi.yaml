        patch:
            operationId: updateRole
            summary: 'Update the name of an editable role'
            security:
                - BearerAuth: []
            responses:
                200:
                    description: 'Update the name of an editable role.'
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
