openapi: 3.1.0
info:
    title: E-commerce backend API
    version: 1.0.0
paths:
    /api/v1/status:
        get:
            operationId: getApiStatus
            summary: Check API and database connectivity
            responses:
                '200':
                    description: The API reached the database.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/HealthStatus'
                '503':
                    $ref: '#/components/responses/Error'
    /api/v1/auth/login:
        post:
            operationId: login
            summary: Issue a bearer token for an account of any role
            parameters:
                - name: X-Cart-Token
                  in: header
                  required: false
                  description: Optionally merge a guest cart during customer login.
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password]
                            properties:
                                email:
                                    type: string
                                    format: email
                                    maxLength: 255
                                password:
                                    type: string
                                    format: password
                                device_name:
                                    type: string
                                    maxLength: 100
            responses:
                '200':
                    description: Signed in.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/AccessGrant'
                '202':
                    description: Staff second-factor verification is required, or an unverified customer must submit the emailed code. No bearer token has been issued.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              oneOf:
                                                  - $ref: '#/components/schemas/TwoFactorChallenge'
                                                  - $ref: '#/components/schemas/EmailVerificationRequired'
                '400':
                    $ref: '#/components/responses/Error'
                '401':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '423':
                    $ref: '#/components/responses/Error'
                '429':
                    description: Too many login attempts.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                        Retry-After:
                            schema:
                                type: integer
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/v1/auth/me:
        get:
            operationId: currentUser
            summary: Get the current account and roles
            security:
                - BearerAuth: []
            responses:
                '200':
                    description: Profile retrieved.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '401':
                    $ref: '#/components/responses/Error'
    /api/v1/auth/logout:
        post:
            operationId: logout
            summary: Revoke the current bearer token
            security:
                - BearerAuth: []
            responses:
                '204':
                    description: Token revoked.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                '401':
                    $ref: '#/components/responses/Error'
    /api/v1/admin/audit-logs:
        get:
            operationId: listAuditLogs
            summary: List audit entries with audit.view permission
            security:
                - BearerAuth: []
            parameters:
                - name: event
                  in: query
                  description: Filter by event code prefix.
                  schema:
                      type: string
                      pattern: '^[a-z0-9.-]+$'
                      maxLength: 100
                - name: user_id
                  in: query
                  description: Filter by actor ID.
                  schema:
                      type: integer
                      minimum: 1
                - name: from
                  in: query
                  description: First UTC day to include.
                  schema:
                      type: string
                      format: date
                - name: to
                  in: query
                  description: Last UTC day to include.
                  schema:
                      type: string
                      format: date
                - name: sort_by
                  in: query
                  schema:
                      type: string
                      enum: [created_at, id, event]
                      default: created_at
                - name: sort_direction
                  in: query
                  schema:
                      type: string
                      enum: [asc, desc]
                      default: desc
                - name: page
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 2147483647
                      default: 1
                - name: per_page
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 20
            responses:
                '200':
                    description: Audit log entries.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/AuditLogEntry'
                                          meta:
                                              type: object
                                              required: [pagination]
                                              properties:
                                                  pagination:
                                                      $ref: '#/components/schemas/Pagination'
                '401':
                    $ref: '#/components/responses/Error'
                '403':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'

    /api/v1/auth/register:
        post:
            operationId: registerCustomer
            summary: Create a customer account
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterCustomer'
            responses:
                '201':
                    description: Create a customer account and send a six-digit email verification code.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '400':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/auth/forgot-password:
        post:
            operationId: requestCustomerPasswordReset
            summary: Accept a customer password reset request
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountEmail'
            responses:
                '202':
                    description: Accept a customer password reset request.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Success'
                '400':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/auth/reset-password:
        post:
            operationId: resetCustomerPassword
            summary: Reset a customer password and revoke bearer tokens
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ResetCustomerPassword'
            responses:
                '204':
                    description: Reset a customer password and revoke bearer tokens.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                '400':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/auth/change-password:
        post:
            operationId: changeCustomerPassword
            summary: Change the customer password and revoke bearer tokens
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChangeCustomerPassword'
            responses:
                '204':
                    description: Change the customer password and revoke bearer tokens.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                '400':
                    $ref: '#/components/responses/Error'
                '401':
                    $ref: '#/components/responses/Error'
                '403':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/auth/email/verification-notification:
        post:
            operationId: sendCustomerVerification
            summary: Send a customer email verification code
            security:
                - BearerAuth: []
            responses:
                '202':
                    description: Send a customer email verification code.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Success'
                '401':
                    $ref: '#/components/responses/Error'
                '403':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/auth/email/resend-verification:
        post:
            operationId: resendCustomerVerificationCode
            summary: Request a new customer email verification code
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountEmail'
            responses:
                '202':
                    description: Returns the same response whether or not an unverified account exists.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Success'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/auth/email/verify-code:
        post:
            operationId: verifyCustomerEmailCode
            summary: Verify a customer email address with its six-digit code
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, code]
                            properties:
                                email:
                                    type: string
                                    format: email
                                    maxLength: 255
                                code:
                                    type: string
                                    pattern: '^[0-9]{6}$'
            responses:
                '200':
                    description: Email address verified.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/auth/email/verify/{id}/{hash}:
        get:
            operationId: verifyCustomerEmail
            summary: Verify a customer email address
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                - name: hash
                  in: path
                  required: true
                  schema:
                      type: string
                - name: expires
                  in: query
                  required: true
                  schema:
                      type: integer
                - name: signature
                  in: query
                  required: true
                  schema:
                      type: string
            responses:
                '204':
                    description: Verify a customer email address.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                '403':
                    $ref: '#/components/responses/Error'
                '404':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/me:
        get:
            operationId: showCustomerProfile
            summary: Read the customer profile
            security:
                - BearerAuth: []
            responses:
                '200':
                    description: Read the customer profile.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '401':
                    $ref: '#/components/responses/Error'
                '403':
                    $ref: '#/components/responses/Error'
        patch:
            operationId: updateCustomerProfile
            summary: Update the customer display name
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateCustomerProfile'
            responses:
                '200':
                    description: Update the customer display name.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '400':
                    $ref: '#/components/responses/Error'
                '401':
                    $ref: '#/components/responses/Error'
                '403':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
    /api/v1/admin/me:
        get:
            operationId: showStaffProfile
            summary: Read the staff profile
            security:
                - BearerAuth: []
            responses:
                '200':
                    description: Read the staff profile.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/StaffAccount'
                '401':
                    $ref: '#/components/responses/Error'
        patch:
            operationId: updateStaffProfile
            summary: Update the staff display name
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateCustomerProfile'
            responses:
                '200':
                    description: Update the staff display name.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/StaffAccount'
                '400':
                    $ref: '#/components/responses/Error'
                '401':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
    /api/v1/admin/auth/logout:
        post:
            operationId: logoutStaff
            summary: Revoke the staff bearer token
            security:
                - BearerAuth: []
            responses:
                '204':
                    description: Revoke the staff bearer token.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                '401':
                    $ref: '#/components/responses/Error'
    /api/v1/admin/auth/forgot-password:
        post:
            operationId: requestStaffPasswordReset
            summary: Accept a staff password reset request
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountEmail'
            responses:
                '202':
                    description: Accept a staff password reset request.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Success'
                '400':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/admin/auth/reset-password:
        post:
            operationId: resetStaffPassword
            summary: Reset the staff password and revoke bearer tokens
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ResetCustomerPassword'
            responses:
                '204':
                    description: Reset the staff password and revoke bearer tokens.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                '400':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/admin/auth/change-password:
        post:
            operationId: changeStaffPassword
            summary: Change the staff password and revoke bearer tokens
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChangeCustomerPassword'
            responses:
                '204':
                    description: Change the staff password and revoke bearer tokens.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                '400':
                    $ref: '#/components/responses/Error'
                '401':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/admin/auth/2fa/setup:
        post:
            operationId: setupStaffTwoFactor
            summary: Start staff TOTP enrollment
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CurrentPassword'
            responses:
                '200':
                    description: Start staff TOTP enrollment.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/TwoFactorEnrollment'
                '400':
                    $ref: '#/components/responses/Error'
                '401':
                    $ref: '#/components/responses/Error'
                '409':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/admin/auth/2fa/confirm:
        post:
            operationId: confirmStaffTwoFactor
            summary: Confirm staff TOTP and revoke prior bearer tokens
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TotpCode'
            responses:
                '200':
                    description: Confirm staff TOTP and revoke prior bearer tokens.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/RecoveryCodes'
                '400':
                    $ref: '#/components/responses/Error'
                '401':
                    $ref: '#/components/responses/Error'
                '409':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/admin/auth/2fa/challenge:
        post:
            operationId: verifyStaffTwoFactorChallenge
            summary: Complete staff login with a TOTP or recovery code
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CompleteTwoFactorChallenge'
            responses:
                '200':
                    description: Complete staff login with a TOTP or recovery code.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/AccessGrant'
                '400':
                    $ref: '#/components/responses/Error'
                '401':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/admin/auth/2fa/recovery:
        post:
            operationId: replaceStaffRecoveryCodes
            summary: Regenerate staff recovery codes
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasswordAndTotpCode'
            responses:
                '200':
                    description: Regenerate staff recovery codes.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/RecoveryCodes'
                '400':
                    $ref: '#/components/responses/Error'
                '401':
                    $ref: '#/components/responses/Error'
                '409':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/admin/auth/2fa/disable:
        post:
            operationId: disableStaffTwoFactor
            summary: Disable staff TOTP and revoke prior bearer tokens
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasswordAndTotpCode'
            responses:
                '204':
                    description: Disable staff TOTP and revoke prior bearer tokens.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                '400':
                    $ref: '#/components/responses/Error'
                '401':
                    $ref: '#/components/responses/Error'
                '409':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/admin/permissions:
        get:
            operationId: listPermissions
            summary: 'List supported staff permissions'
            security:
                - BearerAuth: []
            responses:
                200:
                    description: 'List supported staff permissions.'
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              type: array
                                              items:
                                                  type: string
                401:
                    $ref: '#/components/responses/Error'
                403:
                    $ref: '#/components/responses/Error'
    /api/v1/admin/roles:
        get:
            operationId: listRoles
            summary: 'List staff roles'
            security:
                - BearerAuth: []
            responses:
                200:
                    description: 'List staff roles.'
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/StaffRole'
                401:
                    $ref: '#/components/responses/Error'
                403:
                    $ref: '#/components/responses/Error'
        post:
            operationId: createRole
            summary: 'Create a custom staff role'
            security:
                - BearerAuth: []
            responses:
                201:
                    description: 'Create a custom staff role.'
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/StaffRole'
                400:
                    $ref: '#/components/responses/Error'
                401:
                    $ref: '#/components/responses/Error'
                403:
                    $ref: '#/components/responses/Error'
                422:
                    $ref: '#/components/responses/Error'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateStaffRole'
    '/api/v1/admin/roles/{roleSlug}':
        get:
            operationId: getRole
            summary: 'Read a role by its stable slug'
            security:
                - BearerAuth: []
            responses:
                200:
                    description: 'Read a role by its stable slug.'
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
