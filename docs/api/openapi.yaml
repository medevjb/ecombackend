                '400':
                    $ref: '#/components/responses/Error'
                '401':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/admin/auth/2fa/recovery:
