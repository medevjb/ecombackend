                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/auth/change-password:
        post:
            operationId: changeCustomerPassword
            summary: Change the customer password and revoke bearer tokens
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChangeCustomerPassword'
            responses:
                '204':
                    description: Change the customer password and revoke bearer tokens.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                '400':
                    $ref: '#/components/responses/Error'
                '401':
                    $ref: '#/components/responses/Error'
                '403':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/auth/email/verification-notification:
        post:
            operationId: sendCustomerVerification
            summary: Send a customer email verification link
            security:
                - BearerAuth: []
            responses:
                '202':
                    description: Send a customer email verification link.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Success'
                '401':
                    $ref: '#/components/responses/Error'
                '403':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
    /api/v1/auth/email/verify/{id}/{hash}:
        get:
            operationId: verifyCustomerEmail
            summary: Verify a customer email address
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                - name: hash
                  in: path
                  required: true
                  schema:
                      type: string
                - name: expires
                  in: query
                  required: true
                  schema:
                      type: integer
                - name: signature
                  in: query
                  required: true
                  schema:
                      type: string
            responses:
                '204':
                    description: Verify a customer email address.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                '403':
                    $ref: '#/components/responses/Error'
                '404':
                    $ref: '#/components/responses/Error'
                '429':
                    $ref: '#/components/responses/Error'
