                      type: string
        delete:
            operationId: deleteRole
            summary: 'Delete an unassigned custom role'
            security:
                - BearerAuth: []
            responses:
                204:
                    description: 'Delete an unassigned custom role.'
                    headers:
                        X-Request-Id:
