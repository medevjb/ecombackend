openapi: 3.1.0
info:
    title: E-commerce backend API
    version: 1.0.0
paths:
    /api/v1/status:
        get:
            operationId: getApiStatus
            summary: Check API and database connectivity
            responses:
                '200':
                    description: The API reached the database.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/HealthStatus'
                '503':
                    $ref: '#/components/responses/Error'
    /api/v1/auth/login:
        post:
            operationId: login
            summary: Issue a bearer token for an account of any role
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password]
                            properties:
                                email:
                                    type: string
                                    format: email
                                    maxLength: 255
                                password:
                                    type: string
                                    format: password
                                device_name:
                                    type: string
                                    maxLength: 100
            responses:
                '200':
                    description: Signed in.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/AccessGrant'
                '202':
                    description: Staff second-factor verification is required. No bearer token has been issued.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/TwoFactorChallenge'
                '400':
                    $ref: '#/components/responses/Error'
                '401':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'
                '423':
                    $ref: '#/components/responses/Error'
                '429':
                    description: Too many login attempts.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                        Retry-After:
                            schema:
                                type: integer
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/v1/auth/me:
        get:
            operationId: currentUser
            summary: Get the current account and roles
            security:
                - BearerAuth: []
            responses:
                '200':
                    description: Profile retrieved.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '401':
                    $ref: '#/components/responses/Error'
    /api/v1/auth/logout:
        post:
            operationId: logout
            summary: Revoke the current bearer token
            security:
                - BearerAuth: []
            responses:
                '204':
                    description: Token revoked.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                '401':
                    $ref: '#/components/responses/Error'
    /api/v1/admin/audit-logs:
        get:
            operationId: listAuditLogs
            summary: List audit entries with audit.view permission
            security:
                - BearerAuth: []
            parameters:
                - name: event
                  in: query
                  description: Filter by event code prefix.
                  schema:
                      type: string
                      pattern: '^[a-z0-9.-]+$'
                      maxLength: 100
                - name: user_id
                  in: query
                  description: Filter by actor ID.
                  schema:
                      type: integer
                      minimum: 1
                - name: from
                  in: query
                  description: First UTC day to include.
                  schema:
                      type: string
                      format: date
                - name: to
                  in: query
                  description: Last UTC day to include.
                  schema:
                      type: string
                      format: date
                - name: sort_by
                  in: query
                  schema:
                      type: string
                      enum: [created_at, id, event]
                      default: created_at
                - name: sort_direction
                  in: query
                  schema:
                      type: string
                      enum: [asc, desc]
                      default: desc
                - name: page
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 2147483647
                      default: 1
                - name: per_page
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 20
            responses:
                '200':
                    description: Audit log entries.
                    headers:
                        X-Request-Id:
                            $ref: '#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Success'
                                    - properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/AuditLogEntry'
                                          meta:
                                              type: object
                                              required: [pagination]
                                              properties:
                                                  pagination:
                                                      $ref: '#/components/schemas/Pagination'
                '401':
                    $ref: '#/components/responses/Error'
                '403':
                    $ref: '#/components/responses/Error'
                '422':
                    $ref: '#/components/responses/Error'

    /api/v1/auth/register:
        post:
            operationId: registerCustomer
            summary: Create a customer account
            requestBody:
                required: true
                content:
