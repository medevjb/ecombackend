            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasswordAndTotpCode'
            responses:
                '200':
                    description: Regenerate staff recovery codes.
                    headers:
                        X-Request-Id:
